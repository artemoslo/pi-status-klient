<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fritid og søvn</title>
  <style>
    body  { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1    { font-size: 1.3rem; }
    label { display: block; margin-top: 1.2rem; font-weight: bold; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 8px; margin-top: 4px;
      border: 1px solid #ccc; border-radius: 4px;
      font-size: 1rem;
    }
    button {
      margin-top: 1.5rem; padding: 10px 24px;
      background: #0066aa; color: white;
      border: none; border-radius: 4px;
      font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #0055aa; }
  </style>
</head>
<body>

  <h1>Fritid og søvn</h1>

  <form action="/skjema" method="POST">

    <label for="question1">Hva er favorittsangen din akkurat nå?</label>
    <input type="text" id="question1" name="question1"
           placeholder="Skriv svaret ditt her" required>

    <label for="question2">Hvor mange timer sover du vanligvis?</label>
    <input type="number" id="question2" name="question2" min="0" max="24" value="8">

    <label for="question3">Hva gjør du mest på fritiden?</label>
    <select id="question3" name="question3">
      <option value="Gaming">Gaming</option>
      <option value="Trening">Trening</option>
      <option value="Sosiale medier">Sosiale medier</option>
      <option value="Musikk">Musikk</option>
    </select>

    <button type="submit">Send inn</button>
  </form>

  <p><a href="/">← Til statussiden</a></p>

</body>
</html>
